<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1b19">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div class="wind" aria-hidden="true"></div>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="footer">
    <ul>
      {% if site.social.linkedin %}<li><a href="{{ site.social.linkedin }}" rel="me noopener" target="_blank">LinkedIn</a></li>{% endif %}
      {% if site.social.x %}<li><a href="{{ site.social.x }}" rel="me noopener" target="_blank">X</a></li>{% endif %}
    </ul>
  </footer>
  <script src="{{ '/assets/js/letter-wind.js' | relative_url }}"></script>
  <script>
    // The background: a wind of light over small changing letters, and a ripple wherever the page is clicked.
    // Colours come from --wind-ink and --wind-glow in the stylesheet; the other knobs are at the top of the script.
    (function () {
      var layer = document.querySelector('.wind');
      if (!layer || !window.LetterWind) return;
      var glow = getComputedStyle(document.documentElement).getPropertyValue('--wind-glow').trim();
      LetterWind.attach(layer, {
        theme: 'dark',
        glow: glow || undefined,
        calm: [
          { element: document.querySelector('.verse'), padX: 72, padY: 44, floor: 0.12 },   // behind the verse, at any width
          { x: 0.5, y: 0.95, rx: 130, ry: 50, floor: 0.3 }                                 // behind the footer links
        ]
      });
    })();
  </script>
</body>
</html>
