# Site settings ----------------------------------------------------------------
# Edit the values below to personalise the site. Everything here is available in
# templates via {{ site.title }}, {{ site.author.name }}, and so on.

title: Max Niederhofer
description: >-
  The personal website of Max Niederhofer.
url: "https://maxniederhofer.com"
baseurl: ""
lang: en

author:
  name: Max Niederhofer

# Social links shown in the footer. Comment out any you don't want; the footer
# only renders the ones with a value. Use full URLs.
social:
  linkedin: https://www.linkedin.com/in/maxniederhofer
  x: https://x.com/maxniederhofer

# Build settings ---------------------------------------------------------------
markdown: kramdown
permalink: /:title/
sass:
  style: compressed

# This site ships its own minimal layouts, so no external theme gem is needed.
# GitHub Pages whitelisted plugins:
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
